name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copie APK dans le repo (téléchargeable sur mobile)
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/TubeExtract.apk
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add apk/TubeExtract.apk
          git diff --staged --quiet || git commit -m "APK mis à jour automatiquement"
          git push

      - name: Upload Artifact (sauvegarde)
        uses: actions/upload-artifact@v4
        with:
          name: TubeExtract-debug
          path: apk/TubeExtract.apk
          retention-days: 30
